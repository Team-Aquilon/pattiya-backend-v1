# ============================================================
# Nginx Reverse Proxy — Pattiya Backend
# HTTP: redirect to HTTPS
# HTTPS: proxy to Docker container on port 5000
# ============================================================

server {
    listen 80;
    server_name pattiya-v1-backend.sinethwickramaratna.dev;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pattiya-v1-backend.sinethwickramaratna.dev;

    # SSL certificates (managed by Certbot — populated after first certbot run)
    ssl_certificate     /etc/letsencrypt/live/pattiya-v1-backend.sinethwickramaratna.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pattiya-v1-backend.sinethwickramaratna.dev/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Large body size for image uploads (Cloudinary)
    client_max_body_size 20M;

    # Main API proxy
    location / {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;

        # WebSocket support for Socket.IO
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client IP to Express
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Socket.IO specific path
    location /socket.io/ {
        proxy_pass         http://localhost:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }
}
