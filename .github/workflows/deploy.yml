name: Deploy Pattiya Backend to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: pattiya-backend
  CONTAINER_NAME: pattiya-backend
  APP_PORT: 5000

jobs:
  # ── Job 1: Build & Push Docker Image to ECR ──────────────────
  build-and-push:
    name: Build Docker Image → Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ── Job 2: Deploy to EC2 ──────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@029f5b4b39b4dc31e3e41ed30f8a8adeb0bad1c8 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script: |
            # ── Authenticate Docker with ECR ──
            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin \
              $(aws sts get-caller-identity --query Account --output text).dkr.ecr.ap-south-1.amazonaws.com

            # ── Pull latest image ──
            ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.ap-south-1.amazonaws.com
            docker pull $ECR_REGISTRY/pattiya-backend:latest

            # ── Stop and remove old container (if exists) ──
            docker stop pattiya-backend 2>/dev/null || true
            docker rm pattiya-backend 2>/dev/null || true

            # ── Run new container ──
            docker run -d \
              --name pattiya-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              -e NODE_ENV=production \
              -e PORT=5000 \
              -e HOST=0.0.0.0 \
              -e TRUST_PROXY=true \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
              -e JWT_EXPIRES_IN="15m" \
              -e JWT_REFRESH_EXPIRES_IN="7d" \
              -e INFLUXDB_URL="${{ secrets.INFLUXDB_URL }}" \
              -e INFLUXDB_TOKEN="${{ secrets.INFLUXDB_TOKEN }}" \
              -e INFLUXDB_ORG="${{ secrets.INFLUXDB_ORG }}" \
              -e INFLUXDB_BUCKET="${{ secrets.INFLUXDB_BUCKET }}" \
              -e INFLUXDB_REQUIRED=true \
              -e FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
              -e FIREBASE_CLIENT_EMAIL="${{ secrets.FIREBASE_CLIENT_EMAIL }}" \
              -e FIREBASE_PRIVATE_KEY="${{ secrets.FIREBASE_PRIVATE_KEY }}" \
              -e CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
              -e CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}" \
              -e CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}" \
              -e CLOUDINARY_FOLDER="pattiya" \
              -e MQTT_ENABLED=false \
              -e HEAT_CRON_ENABLED=true \
              $ECR_REGISTRY/pattiya-backend:latest

            # ── Clean up old Docker images ──
            docker image prune -f

      - name: Health Check
        run: |
          echo "Waiting 30s for container to start..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pattiya-v1-backend.sinethwickramaratna.dev/api/v1/health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Deploy successful! Health check passed (HTTP $STATUS)"
          else
            echo "❌ Health check failed! HTTP $STATUS"
            exit 1
          fi
