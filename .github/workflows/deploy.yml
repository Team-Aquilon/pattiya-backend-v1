name: Deploy Pattiya Backend to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: pattiya-backend

jobs:
  # -- Job 1: Build & Push Docker Image to ECR ------------------
  build-and-push:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # -- Job 2: Deploy to EC2 --------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/pattiya-ec2-key.pem
          chmod 600 ~/.ssh/pattiya-ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Write .env file to EC2 via SCP
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
          INFLUXDB_BUCKET: ${{ secrets.INFLUXDB_BUCKET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          node -e '
          const fs = require("fs");
          function clean(val) {
            let v = (val || "").trim();
            if ((v.startsWith("\"") && v.endsWith("\"")) || (v.startsWith("\x27") && v.endsWith("\x27"))) {
              v = v.slice(1, -1);
            }
            return v;
          }
          let fbKey = clean(process.env.FIREBASE_PRIVATE_KEY);
          fbKey = fbKey.replace(/\r?\n/g, "\\n");

          const env = [
            "NODE_ENV=production",
            "PORT=5000",
            "HOST=0.0.0.0",
            "TRUST_PROXY=true",
            "JWT_EXPIRES_IN=15m",
            "JWT_REFRESH_EXPIRES_IN=7d",
            "INFLUXDB_REQUIRED=false",
            "MQTT_ENABLED=false",
            "HEAT_CRON_ENABLED=true",
            "CLOUDINARY_FOLDER=pattiya",
            "MONGODB_URI=" + clean(process.env.MONGODB_URI),
            "JWT_SECRET=" + clean(process.env.JWT_SECRET),
            "JWT_REFRESH_SECRET=" + clean(process.env.JWT_REFRESH_SECRET),
            "INFLUXDB_URL=" + clean(process.env.INFLUXDB_URL),
            "INFLUXDB_TOKEN=" + clean(process.env.INFLUXDB_TOKEN),
            "INFLUXDB_ORG=" + clean(process.env.INFLUXDB_ORG),
            "INFLUXDB_BUCKET=" + clean(process.env.INFLUXDB_BUCKET),
            "FIREBASE_PROJECT_ID=" + clean(process.env.FIREBASE_PROJECT_ID),
            "FIREBASE_CLIENT_EMAIL=" + clean(process.env.FIREBASE_CLIENT_EMAIL),
            "FIREBASE_PRIVATE_KEY=" + fbKey,
            "CLOUDINARY_CLOUD_NAME=" + clean(process.env.CLOUDINARY_CLOUD_NAME),
            "CLOUDINARY_API_KEY=" + clean(process.env.CLOUDINARY_API_KEY),
            "CLOUDINARY_API_SECRET=" + clean(process.env.CLOUDINARY_API_SECRET)
          ].join("\n");
          fs.writeFileSync("/tmp/pattiya.env", env + "\n");
          '
          scp -i ~/.ssh/pattiya-ec2-key.pem /tmp/pattiya.env ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/pattiya.env
          rm /tmp/pattiya.env

      - name: Deploy Docker container on EC2
        run: |
          ssh -i ~/.ssh/pattiya-ec2-key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            export PATH=$PATH:/usr/local/bin:/snap/bin

            # Install AWS CLI if not present
            if ! command -v aws &>/dev/null; then
              echo "Installing AWS CLI..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
              unzip -q /tmp/awscliv2.zip -d /tmp/
              sudo /tmp/aws/install
              rm -rf /tmp/awscliv2.zip /tmp/aws/
              echo "AWS CLI installed."
            fi

            # Ensure permissions on env file
            chmod 644 /home/ubuntu/pattiya.env

            # Get ECR registry from IAM instance role
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com"

            # Login to ECR
            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"

            # Pull latest image
            docker pull "$ECR_REGISTRY/pattiya-backend:latest"

            # Pre-flight container test
            echo "--- Pre-flight Test 1: Node execution ---"
            docker run --rm "$ECR_REGISTRY/pattiya-backend:latest" node -e "console.log('Node works in container! Version: ' + process.version)"

            echo "--- Pre-flight Test 2: Config loading ---"
            docker run --rm \
              -v /home/ubuntu/pattiya.env:/app/.env:ro \
              --env-file /home/ubuntu/pattiya.env \
              "$ECR_REGISTRY/pattiya-backend:latest" \
              node -e "
                const config = require('./src/config');
                console.log('MongoDB URI set:', Boolean(config.mongo.uri));
                console.log('Port:', config.server.port);
                console.log('Host:', config.server.host);
                console.log('Environment:', config.server.env);
              "

            # Stop and remove old container
            docker stop pattiya-backend 2>/dev/null || true
            docker rm pattiya-backend 2>/dev/null || true

            # Run new container
            docker run -d \
              --name pattiya-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              -v /home/ubuntu/pattiya.env:/app/.env:ro \
              --env-file /home/ubuntu/pattiya.env \
              "$ECR_REGISTRY/pattiya-backend:latest"

            docker image prune -f
            echo "Waiting 5s for startup..."
            sleep 5
            docker ps -a
            echo "--- Container startup logs ---"
            docker logs pattiya-backend --tail 50
            echo "Deploy step complete!"
          ENDSSH

      - name: Health Check
        run: |
          ssh -i ~/.ssh/pattiya-ec2-key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            echo "Checking health endpoint with retry loop..."
            for i in {1..12}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/v1/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Deploy successful! Health check passed on attempt $i (HTTP 200)"
                exit 0
              fi
              echo "Attempt $i/12: HTTP $STATUS - waiting 5s..."
              sleep 5
            done
            echo "Health check failed after 60 seconds!"
            echo "--- Container status ---"
            docker ps -a
            echo "--- Container logs ---"
            docker logs pattiya-backend --tail 100
            exit 1
          ENDSSH
