name: Deploy Pattiya Backend to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: pattiya-backend

jobs:
  # -- Job 1: Build & Push Docker Image to ECR ------------------
  build-and-push:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # -- Job 2: Deploy to EC2 --------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/pattiya-ec2-key.pem
          chmod 600 ~/.ssh/pattiya-ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Write .env file to EC2 via SCP
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
          INFLUXDB_BUCKET: ${{ secrets.INFLUXDB_BUCKET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          cat > /tmp/pattiya.env << EOF
          NODE_ENV=production
          PORT=5000
          HOST=0.0.0.0
          TRUST_PROXY=true
          JWT_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d
          INFLUXDB_REQUIRED=true
          MQTT_ENABLED=false
          HEAT_CRON_ENABLED=true
          CLOUDINARY_FOLDER=pattiya
          MONGODB_URI=${MONGODB_URI}
          JWT_SECRET=${JWT_SECRET}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          INFLUXDB_URL=${INFLUXDB_URL}
          INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
          INFLUXDB_ORG=${INFLUXDB_ORG}
          INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
          FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
          FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
          FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
          CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
          CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
          CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
          EOF
          scp -i ~/.ssh/pattiya-ec2-key.pem /tmp/pattiya.env ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/pattiya.env
          rm /tmp/pattiya.env

      - name: Deploy Docker container on EC2
        run: |
          ssh -i ~/.ssh/pattiya-ec2-key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            export PATH=$PATH:/usr/local/bin:/snap/bin

            # Install AWS CLI if not present
            if ! command -v aws &>/dev/null; then
              echo "Installing AWS CLI..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
              unzip -q /tmp/awscliv2.zip -d /tmp/
              sudo /tmp/aws/install
              rm -rf /tmp/awscliv2.zip /tmp/aws/
              echo "AWS CLI installed."
            fi

            # Get ECR registry from IAM instance role
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com"

            # Login to ECR
            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"

            # Pull latest image
            docker pull "$ECR_REGISTRY/pattiya-backend:latest"

            # Stop and remove old container
            docker stop pattiya-backend 2>/dev/null || true
            docker rm pattiya-backend 2>/dev/null || true

            # Run new container using env file
            docker run -d \
              --name pattiya-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              --env-file /home/ubuntu/pattiya.env \
              "$ECR_REGISTRY/pattiya-backend:latest"

            docker image prune -f
            echo "Deploy complete!"
          ENDSSH

      - name: Health Check
        run: |
          echo "Waiting 30s for container to start..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:5000/api/v1/health || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Deploy successful! Health check passed (HTTP $STATUS)"
          else
            echo "Health check failed! HTTP $STATUS"
            exit 1
          fi
